<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }

        #meme-container {
            position: relative;
            margin: 20px auto;
            width: 80%;
            max-width: 500px;
            text-align: center;
        }

        #meme-image {
            width: 100%;
            height: auto;
            display: none; /* Hide the image initially */
        }

        #generate-meme {
            margin-bottom: 20px; /* Adds space between the button and the meme */
            padding: 10px 20px;
            font-size: 16px;
            background-color: #00bfff; /* Light blue color */
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        #generate-meme:hover {
            background-color: #1e90ff; /* Darker blue on hover */
        }

        #no-image {
            display: none;
            font-size: 18px;
            color: #555;
        }
    </style>
</head>
<body>
    <h1>🗿 Meme Generator 🗿</h1>

    <div id="meme-container">
        <button id="generate-meme">Generate Meme</button>
        <img id="meme-image" src="" alt="Meme" />
        <div id="no-image">No Image Found</div>
    </div>

    <script>
        const memeImage = document.getElementById('meme-image');
        const generateMemeBtn = document.getElementById('generate-meme');
        const noImageDiv = document.getElementById('no-image');

        // Fetch meme data from the Meme API
        async function fetchMeme() {
            try {
                const response = await fetch('https://meme-api.com/gimme');
                const data = await response.json();
                
                if (data.url) {
                    memeImage.src = data.url;
                    memeImage.style.display = 'block'; // Show image
                    noImageDiv.style.display = 'none'; // Hide 'No Image Found' message
                } else {
                    memeImage.style.display = 'none'; // Hide image if no URL
                    noImageDiv.style.display = 'block'; // Show 'No Image Found' message
                }
            } catch (error) {
                memeImage.style.display = 'none'; // Hide image on error
                noImageDiv.style.display = 'block'; // Show 'No Image Found' message
            }
        }

        // Generate new meme on button click
        generateMemeBtn.addEventListener('click', fetchMeme);
    </script>
</body>
</html>
